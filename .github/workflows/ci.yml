name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── macOS ────────────────────────────────────────────────────────────────
  macos:
    name: Build & test — macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build (debug)
        run: swift build -v

      - name: Test (parallel)
        run: swift test --parallel -v

  # ── iOS Simulator ─────────────────────────────────────────────────────────
  ios:
    name: Build & test — iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ios-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ios-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build library targets for iOS Simulator
        run: |
          set -eo pipefail
          # Build library schemes individually — Strata-Package includes the
          # strata CLI executable which has no entry point on iOS (the whole
          # file is #if os(macOS)) and fails to link on iOS Simulator.
          for scheme in StrataCore StrataTesting StrataInspect; do
            echo "Building $scheme..."
            xcodebuild build \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          done
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Test on iOS Simulator
        run: |
          set -eo pipefail
          # Pick the latest available iPhone simulator (--json is the correct simctl flag)
          SIM=$(xcrun simctl list devices available --json \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          iphones = sorted(
              [(r, v) for r, devs in d['devices'].items()
               for v in devs
               if 'iPhone' in v.get('name', '') and v.get('isAvailable')],
              key=lambda x: x[0], reverse=True)
          if iphones: print(iphones[0][1]['udid'])
          ")
          if [ -z "$SIM" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          echo "Simulator UDID: $SIM"
          xcodebuild test \
            -scheme Strata-Package \
            -destination "id=$SIM" \
            -skipPackagePluginValidation \
            -only-testing:StrataCoreTests \
            -only-testing:StrataTestingTests \
            -only-testing:StrataInspectTests \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

  # ── CLI smoke test ────────────────────────────────────────────────────────
  cli-smoke:
    name: CLI smoke test
    runs-on: macos-15
    needs: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI (release)
        run: swift build -c release --product strata
      - name: Verify CLI
        run: .build/release/strata --help

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Package.swift parses
        run: swift package describe
      - name: No committed build artifacts
        run: |
          if [ -d .build ]; then
            echo "::error::.build should not be committed"; exit 1
          fi
